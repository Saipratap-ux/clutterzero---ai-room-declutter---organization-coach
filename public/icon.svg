<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#cbd5e1" />
      <stop offset="75%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="electricBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.35" />

  <!-- Subtle grid aura -->
  <circle cx="256" cy="270" r="160" fill="#2563eb" fill-opacity="0.12" filter="url(#glow)" />

  <!-- Golden Crown -->
  <g transform="translate(146, 85)">
    <!-- Crown base & peaks -->
    <path d="M 10 90 L 35 25 L 110 55 L 110 10 L 110 55 L 185 25 L 210 90 Z" fill="url(#goldGrad)" />
    <!-- Crown headband -->
    <rect x="8" y="90" width="204" height="22" rx="4" fill="url(#goldGrad)" />
    <!-- Crown jewels -->
    <circle cx="35" cy="23" r="8" fill="#60a5fa" stroke="#ffffff" stroke-width="2" />
    <circle cx="110" cy="8" r="10" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />
    <circle cx="185" cy="23" r="8" fill="#60a5fa" stroke="#ffffff" stroke-width="2" />
    <circle cx="55" cy="101" r="5" fill="#ffffff" />
    <circle cx="110" cy="101" r="6" fill="#38bdf8" />
    <circle cx="165" cy="101" r="5" fill="#ffffff" />
  </g>

  <!-- Royal Metallic & Electric S Character -->
  <g transform="translate(136, 175)">
    <!-- Dimensional S Shadow/Backing -->
    <path d="M 180 50 C 180 50, 140 18, 90 20 C 40 22, 10 55, 10 95 C 10 145, 55 170, 120 195 C 195 225, 230 255, 230 310 C 230 375, 175 410, 110 410 C 50 410, 10 375, 10 375 L 25 320 C 25 320, 65 355, 110 355 C 150 355, 175 330, 175 295 C 175 250, 135 225, 75 200 C 15 170, -35 135, -35 80 C -35 15, 30 -30, 105 -30 C 160 -30, 200 5, 200 5 Z" fill="#0284c7" opacity="0.15" transform="translate(6, 6)" />

    <!-- Sharp Tech Metallic S Shape -->
    <path d="M 185 45 C 170 30, 145 15, 105 15 C 50 15, 20 48, 20 88 C 20 135, 60 162, 128 188 C 200 216, 232 250, 232 305 C 232 372, 178 408, 110 408 C 45 408, 5 372, 5 372 L 24 322 C 48 344, 80 358, 112 358 C 152 358, 178 335, 178 300 C 178 258, 140 234, 76 208 C 12 180, -28 145, -28 85 C -28 22, 28 -25, 105 -25 C 156 -25, 195 5, 195 5 Z" fill="url(#silverGrad)" />
    
    <!-- Accent Electric Edge -->
    <path d="M 105 15 C 50 15, 20 48, 20 88 C 20 135, 60 162, 128 188 L 138 180 C 80 155, 45 130, 45 88 C 45 58, 68 35, 105 35 C 140 35, 165 48, 178 60 L 195 5 C 165 -15, 135 -25, 105 -25" fill="url(#electricBlueGrad)" opacity="0.9" />

    <!-- Golden Highlight Rib -->
    <path d="M 110 408 C 45 408, 5 372, 5 372 L 24 322 C 48 344, 80 358, 112 358 C 152 358, 178 335, 178 300 L 232 305 C 232 372, 178 408, 110 408 Z" fill="url(#goldGrad)" opacity="0.85" />
  </g>
</svg>
