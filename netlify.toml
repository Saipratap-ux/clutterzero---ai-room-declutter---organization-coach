# SAIPRTAP Netlify Build and Routing Configuration
# Compatible with Netlify continuous deployment and serverless functions

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Redirect serverless API routes to Netlify Functions
[[redirects]]
  from = "/api/ai/generate"
  to = "/.netlify/functions/generate"
  status = 200

[[redirects]]
  from = "/api/ai/fix"
  to = "/.netlify/functions/fix"
  status = 200

[[redirects]]
  from = "/api/ai/metrics"
  to = "/.netlify/functions/metrics"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Single Page App routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and cache headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
